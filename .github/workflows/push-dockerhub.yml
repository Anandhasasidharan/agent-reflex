name: Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra tag to push (e.g. v1.0.0); blank = latest + commit SHA only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  push-to-dockerhub:
    name: Build & push asd492/agent_reflex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets
        # (hub.docker.com -> Account Settings -> Security -> New Access Token).
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: asd492/agent_reflex
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
