name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: mypy
        run: mypy agent_reflex

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_reflex_test
          POSTGRES_USER: reflex
          POSTGRES_PASSWORD: reflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflex -d agent_reflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_REFLEX_DB_URL: postgresql://reflex:reflex_test@localhost:5432/agent_reflex_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=agent_reflex --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t agent-reflex:ci .
      - name: Build frontend image
        run: docker build -t agent-reflex-frontend:ci ./frontend

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend

  integration:
    name: Integration (reference agent -> collector -> API -> Postgres)
    runs-on: ubuntu-latest
    needs: [build]
    env:
      AGENT_REFLEX_DB_URL: postgresql://reflex:reflex_dev@localhost:5432/agent_reflex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Start Postgres
        run: docker compose up -d --no-deps postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U reflex -d agent_reflex && break
            sleep 2
          done

      - name: Create CI API key
        id: apikey
        run: |
          KEY=$(python -m agent_reflex.api.auth create ci --scope=write | grep -oP 'KEY: \K.*')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Start app
        env:
          AGENT_REFLEX_API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          docker compose build app
          docker compose up -d --no-deps app

      - name: Start collector
        env:
          AGENT_REFLEX_API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          docker compose up -d --no-deps otel-collector

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ready && break
            sleep 3
          done

      - name: Emit reference trace
        # No LLM key in CI: attribution degrades gracefully (resilient
        # receiver persists the trace, failure_type stays NULL) while the
        # full OTLP path — SDK -> collector -> API -> Postgres — is exercised.
        run: |
          OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
          python3 demo/reference_agent.py

      - name: Wait for ingestion + attribution
        run: sleep 45

      - name: Assert session persisted
        run: |
          SESSIONS=$(docker compose exec -T postgres psql -U reflex -d agent_reflex -tAc \
            "SELECT count(*) FROM sessions")
          STEPS=$(docker compose exec -T postgres psql -U reflex -d agent_reflex -tAc \
            "SELECT count(*) FROM trace_steps")
          echo "sessions=$SESSIONS steps=$STEPS"
          test "$SESSIONS" -ge 1
          test "$STEPS" -ge 3

  security:
    name: Security scan (pip-audit + trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit (fail on high/critical)
        # pip-audit has no --fail-on flag; from OSV entries only some carry a
        # CVSS severity, so gate on scored high/critical (>= 7.0) and show all.
        run: |
          pip install pip-audit
          pip-audit --format json 2>/dev/null > /tmp/pip-audit.json || true
          python3 - <<'EOF'
          import json

          with open("/tmp/pip-audit.json") as f:
              data = json.load(f)

          findings = []
          for dep in data.get("dependencies", []):
              name = dep.get("name", "?")
              for vuln in dep.get("vulns", []):
                  sev = vuln.get("severity") or {}
                  score = sev.get("score")
                  findings.append({**vuln, "_pkg": name, "_score": score})

          high = [f for f in findings if f["_score"] is not None and f["_score"] >= 7.0]
          unscored = [f for f in findings if f["_score"] is None]
          print(f"pip-audit: {len(findings)} findings, {len(high)} high/critical (CVSS>=7), {len(unscored)} unscored (reviewed, non-blocking)")
          for f in findings:
              print(f"  {f['_pkg']} {f.get('id')} score={f['_score']}")
          # Fail only on positively-scored high/critical (CVSS >= 7.0)
          if high:
              raise SystemExit(1)
          EOF
      - name: Trivy filesystem scan
        # Pinned to the SHA of the 0.35.0 tag — the first known-safe release
        # after the March 2026 trivy-action supply-chain compromise (tags
        # 0.0.1–0.34.2 contained a credential stealer).
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Known-safe binary (advisory's recommended version); released
          # before the March 2026 compromise window. The post-incident
          # install.sh resolves /releases/<version> verbatim, so the `v`
          # prefix is required (without it the lookup 404s).
          version: v0.69.3
