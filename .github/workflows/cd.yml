name: CD

on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (guarded by vars.DEPLOY_ENABLED + SSH secrets)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && secrets.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR || '/opt/agent_reflex' }}
            git pull --ff-only
            export AGENT_REFLEX_API_KEY=$(cat .env | grep '^AGENT_REFLEX_API_KEY=' | cut -d= -f2)
            docker compose pull app
            docker compose up -d app
            for i in $(seq 1 30); do
              curl -sf http://localhost:8000/ready && exit 0
              sleep 5
            done
            echo "app failed to become ready" >&2
            exit 1
