[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_reflex"
version = "0.1.0"
description = "Multi-agent reliability platform: causal attribution, adaptive recovery, calibrated escalation"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation>=0.46b0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "neo4j>=5.20",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "structlog>=24.1",

    "openai>=1.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
crewai = ["crewai>=0.60.0"]

[tool.setuptools.packages.find]
include = ["agent_reflex*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/", "demo/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
