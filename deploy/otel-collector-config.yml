receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    timeout: 2s

exporters:
  otlphttp/agentreflex:
    endpoint: ${env:AGENT_REFLEX_API_ENDPOINT:-http://app:8000}
    tls:
      insecure: true
    compression: none
    timeout: 300s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    headers:
      x-api-key: ${env:AGENT_REFLEX_API_KEY}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/agentreflex]
